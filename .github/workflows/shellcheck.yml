name: Shellcheck

on:
  push:
    paths:
      - "install.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "install.sh"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "config"
          # install.sh is zsh, not bash/sh — shellcheck has no native zsh
          # dialect, so we run it in bash mode and exclude the codes that
          # are known false positives for zsh-only syntax: SC2190
          # (associative array literals), SC2154/SC2162 (zsh's
          # `read "var?prompt"` form misread as bash's `read var`).
          additional_files: "install.sh"
        env:
          SHELLCHECK_OPTS: -s bash -e SC1009,SC1072,SC1073,SC2296,SC2298,SC2034,SC2190,SC2154,SC2162,SC1091
