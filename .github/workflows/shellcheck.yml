name: Shellcheck

on:
  push:
    paths:
      - "install.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "install.sh"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "config"
          # install.sh is zsh, not bash/sh — SC1xxx shell-dialect checks
          # produce false positives on zsh-only syntax (e.g. ${(%):-%x},
          # ${(k)ASSOC_ARRAY}). SC2034 unused-var check also misfires on
          # zsh associative array iteration.
          additional_files: "install.sh"
        env:
          SHELLCHECK_OPTS: -s bash -e SC1009,SC1072,SC1073,SC2296,SC2298,SC2034
