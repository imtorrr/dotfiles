# Starship prompt config — used by both zsh (zshrc) and PowerShell (profile.ps1)
# Docs: https://starship.rs/config/

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$cmd_duration
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
